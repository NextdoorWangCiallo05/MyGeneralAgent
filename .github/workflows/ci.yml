name: CI

on:
  push:
  pull_request:

jobs:
  # 密钥扫描：拦住「真实 API Key / 密码被推进仓库」这类事故。
  # 规则与白名单见 .gitleaks.toml；本地想有同样一道闸，跑 scripts/install-git-hooks.ps1。
  secrets:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须全量历史：gitleaks 扫的是提交内容，浅克隆只看得到最后一次 diff
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # PR 上不刷评论，只在检查结果里给结论
          GITLEAKS_ENABLE_COMMENTS: 'false'
          # 命中时把报告留成 artifact，方便定位
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          # 组织（非个人）仓库需要 License，个人账号无需配置

  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: 安装依赖
        run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest -q

  frontend:
    name: 前端类型检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: tsc --noEmit
        run: npm run typecheck

  scripts:
    name: 启动脚本检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: bash 语法检查
        run: bash -n scripts/start.sh

      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S error scripts/start.sh

      # 真正跑一遍：--setup 只准备环境，可覆盖 setsid 缺失、路径写错之类的问题
      - name: 冒烟运行 start.sh --setup
        run: bash scripts/start.sh --setup --skip-install

      - name: 校验 PowerShell 脚本可解析
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/start.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host 'start.ps1 解析通过'
